name: Build Sala Leitura APK

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Ensure Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-37' 'build-tools;36.0.0'

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/source.b64.part* > /tmp/SalaLeitura.b64
          base64 --decode /tmp/SalaLeitura.b64 > /tmp/SalaLeitura.tar.gz
          echo '0ffbf6f4d26580016393183d7ee36443bf1e9e3331fa2a18f1705efbee5414c5  /tmp/SalaLeitura.tar.gz' | sha256sum --check
          rm -rf /tmp/SalaLeitura
          mkdir -p /tmp/SalaLeitura
          tar -xzf /tmp/SalaLeitura.tar.gz -C /tmp/SalaLeitura
          test -f /tmp/SalaLeitura/settings.gradle.kts
          test -f /tmp/SalaLeitura/app/build.gradle.kts
          grep -nE 'compileSdk|targetSdk|minSdk' /tmp/SalaLeitura/app/build.gradle.kts

      - name: Build debug APK
        working-directory: /tmp/SalaLeitura
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        working-directory: /tmp/SalaLeitura
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/SalaLeitura/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalaLeitura-SME-SP-v1-debug-apk
          path: /tmp/SalaLeitura/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
