name: Build Sala Leitura APK

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if [ ! -d "${ANDROID_HOME}/platforms/android-36" ]; then
            "$SDKMANAGER" 'platforms;android-36'
          fi
          if [ ! -d "${ANDROID_HOME}/build-tools/36.0.0" ]; then
            "$SDKMANAGER" 'build-tools;36.0.0'
          fi

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/source.b64.part* > /tmp/SalaLeitura.b64
          base64 --decode /tmp/SalaLeitura.b64 > /tmp/SalaLeitura.tar.gz
          echo '0ffbf6f4d26580016393183d7ee36443bf1e9e3331fa2a18f1705efbee5414c5  /tmp/SalaLeitura.tar.gz' | sha256sum --check
          rm -rf /tmp/SalaLeitura
          mkdir -p /tmp/SalaLeitura
          tar -xzf /tmp/SalaLeitura.tar.gz -C /tmp/SalaLeitura
          test -f /tmp/SalaLeitura/settings.gradle.kts
          test -f /tmp/SalaLeitura/app/build.gradle.kts

      - name: Apply Kotlin source fixes
        shell: bash
        run: |
          set -euo pipefail
          cp -R ci/overlay/. /tmp/SalaLeitura/
          grep -n 'AuditLogEntity(' /tmp/SalaLeitura/app/src/main/java/br/gov/sp/sme/salaleitura/data/repository/CirculationRepository.kt
          grep -n 'Result<.*> = withContext' /tmp/SalaLeitura/app/src/main/java/br/gov/sp/sme/salaleitura/feature/backup/BackupManager.kt
          grep -n 'onFinished = {' /tmp/SalaLeitura/app/src/main/java/br/gov/sp/sme/salaleitura/ui/navigation/AppNav.kt

      - name: Apply API 36 compatible AndroidX set
        shell: bash
        run: |
          set -euo pipefail
          FILE=/tmp/SalaLeitura/app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' "$FILE"
          sed -i 's/compose-bom:2026.08.00/compose-bom:2025.08.00/' "$FILE"
          sed -i 's/navigation-compose:2.10.1/navigation-compose:2.9.5/' "$FILE"
          sed -i 's/lifecycle-runtime-compose:2.10.0/lifecycle-runtime-compose:2.9.4/' "$FILE"
          sed -i 's/lifecycle-viewmodel-compose:2.10.0/lifecycle-viewmodel-compose:2.9.4/' "$FILE"
          sed -i 's/room-runtime:2.8.5/room-runtime:2.8.1/' "$FILE"
          sed -i 's/room-ktx:2.8.5/room-ktx:2.8.1/' "$FILE"
          sed -i 's/room-compiler:2.8.5/room-compiler:2.8.1/' "$FILE"
          sed -i 's/camera-core:1.6.2/camera-core:1.5.1/' "$FILE"
          sed -i 's/camera-camera2:1.6.2/camera-camera2:1.5.1/' "$FILE"
          sed -i 's/camera-lifecycle:1.6.2/camera-lifecycle:1.5.1/' "$FILE"
          sed -i 's/camera-view:1.6.2/camera-view:1.5.1/' "$FILE"
          grep -nE 'compileSdk|targetSdk|minSdk|compose-bom|navigation-compose|lifecycle-.*-compose|room-|camera-' "$FILE"

      - name: Build debug APK
        working-directory: /tmp/SalaLeitura
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        working-directory: /tmp/SalaLeitura
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/SalaLeitura/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalaLeitura-SME-SP-v1-debug-apk
          path: /tmp/SalaLeitura/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
